name: Build Hisingen China Fast 2

on:
  push:
    branches:
      - "chatgpt/hisingen-china-build-0.16.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hisingen China
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -1)"
            test -n "$XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Clone upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.0.10 \
            https://github.com/NicolasKheirallah/Hisingen.git \
            "$RUNNER_TEMP/Hisingen"

      - name: Patch China region
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$RUNNER_TEMP/Hisingen/Sources/Hisingen/App"

          cat > "$APPDIR/ChinaPolestarRegionController.swift" <<'SWIFT'
          import AppKit
          import Foundation
          import WebKit

          @MainActor
          final class ChinaPolestarRegionController: NSObject {
              private static let shared = ChinaPolestarRegionController()
              private static let defaultsKey = "hisingen.polestar.signInRegion"
              private var window: NSWindow?
              private var webView: WKWebView?

              static func install() {
                  if UserDefaults.standard.object(forKey: defaultsKey) == nil {
                      UserDefaults.standard.set("global", forKey: defaultsKey)
                  }
                  shared.installMenuItem()
              }

              private func installMenuItem() {
                  guard let appMenu = NSApp.mainMenu?.items.first?.submenu else { return }
                  if appMenu.items.contains(where: { $0.title == "Polestar Sign-In Region…" }) {
                      return
                  }
                  let item = NSMenuItem(
                      title: "Polestar Sign-In Region…",
                      action: #selector(showChooser(_:)),
                      keyEquivalent: ""
                  )
                  item.target = self
                  let settingsIndex = appMenu.items.firstIndex {
                      ["Settings…", "Settings...", "Preferences…", "Preferences..."].contains($0.title)
                  }
                  appMenu.insertItem(item, at: settingsIndex.map { $0 + 1 } ?? 0)
              }

              @objc private func showChooser(_ sender: Any?) {
                  let alert = NSAlert()
                  alert.messageText = "Polestar Sign-In Region"
                  alert.informativeText =
                      "Global keeps Hisingen's original Polestar login. " +
                      "China opens the official Polestar China website. " +
                      "Website login does not verify a China vehicle API session."
                  alert.addButton(withTitle: "Global Polestar ID")
                  alert.addButton(withTitle: "China Polestar ID · Official Web Sign-In")
                  alert.addButton(withTitle: "Cancel")

                  switch alert.runModal() {
                  case .alertFirstButtonReturn:
                      UserDefaults.standard.set("global", forKey: Self.defaultsKey)
                      openSettings()
                  case .alertSecondButtonReturn:
                      UserDefaults.standard.set("chinaOfficialWeb", forKey: Self.defaultsKey)
                      openChinaWeb()
                  default:
                      break
                  }
              }

              private func openSettings() {
                  guard let root = NSApp.mainMenu else { return }
                  for item in root.items {
                      guard let submenu = item.submenu else { continue }
                      if let settings = submenu.items.first(where: {
                          ["Settings…", "Settings...", "Preferences…", "Preferences..."].contains($0.title)
                      }), let action = settings.action {
                          _ = NSApp.sendAction(action, to: settings.target, from: settings)
                          return
                      }
                  }
              }

              private func openChinaWeb() {
                  if let window {
                      window.makeKeyAndOrderFront(nil)
                      NSApp.activate(ignoringOtherApps: true)
                      return
                  }

                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = .default()
                  let web = WKWebView(frame: NSRect(x: 0, y: 0, width: 700, height: 820), configuration: config)
                  web.load(URLRequest(url: URL(string: "https://www.polestar.cn/zh-cn/auth/login/")!))

                  let newWindow = NSWindow(
                      contentRect: NSRect(x: 0, y: 0, width: 700, height: 820),
                      styleMask: [.titled, .closable, .miniaturizable, .resizable],
                      backing: .buffered,
                      defer: false
                  )
                  newWindow.title = "China Polestar ID · Official Web Sign-In"
                  newWindow.contentView = web
                  newWindow.center()
                  newWindow.isReleasedWhenClosed = false
                  self.webView = web
                  self.window = newWindow
                  newWindow.makeKeyAndOrderFront(nil)
                  NSApp.activate(ignoringOtherApps: true)
              }
          }
          SWIFT

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "Hisingen/Sources/Hisingen/App/AppDelegate.swift"
          s = p.read_text(encoding="utf-8")
          needle = "        mainMenuController.install()\n"
          hook = needle + "        ChinaPolestarRegionController.install()\n"
          if "ChinaPolestarRegionController.install()" not in s:
              if needle not in s:
                  raise SystemExit("launch hook not found")
              p.write_text(s.replace(needle, hook, 1), encoding="utf-8")
          PY

      - name: Build
        working-directory: ${{ runner.temp }}/Hisingen
        shell: bash
        env:
          NOTARIZE: never
        run: |
          set -euo pipefail
          rm -rf .build
          swift package resolve
          NOTARIZE=never make app
          test -d releases/Hisingen.app

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          cp -R "$RUNNER_TEMP/Hisingen/releases/Hisingen.app" "$DIST/Hisingen China.app"
          codesign --force --deep --sign - "$DIST/Hisingen China.app"
          codesign --verify --deep --strict --verbose=2 "$DIST/Hisingen China.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$DIST/Hisingen China.app" "$DIST/Hisingen-China.app.zip"
          cd "$DIST"
          shasum -a 256 Hisingen-China.app.zip > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisingen-China-macOS
          path: |
            ${{ runner.temp }}/dist/Hisingen-China.app.zip
            ${{ runner.temp }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
